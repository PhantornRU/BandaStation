author: "mo0niverse"
delete-after: True
changes:
  - bugfix: "Предметы из малого грузового отсека пода можно забрать; ящик выгружается рядом с корпусом."
  - bugfix: "Закрытие ящика больше не затягивает внутрь целый под."
  - bugfix: "Речь экипажа пода не оставляет дублирующиеся пузырьки во время движения."
  - bugfix: "Переход пода между секторами учитывает весь корпус без дополнительного шага."
  - bugfix: "Посадка шаттла уничтожает под под ним, сохраняя штатную перевозку подов на борту."
  - bugfix: "Враждебные NPC могут атаковать под с враждебным экипажем."
  - qol: "Грузовой отсек можно открыть или выгрузить пустой рукой снаружи, а пилот может выгрузить выбранную вещь через меню систем."