author: "mo0niverse"
delete-after: True
changes:
  - rscadd: "В предыстории вульпканинов доступны Рахт, Догмат Мзманулина и община беженцев."
  - bugfix: "Объединения Вольных секторов и их подразделения правильно вложены в дерево фракций; старые анкеты сохраняют выбранную принадлежность."
  - qol: "Основные списки проживания и воспитания учитывают контекст анкеты; другие допустимые варианты доступны через «Другую среду / диаспору»."
  - bugfix: "Известные несовместимые сочетания предыстории очищаются при загрузке с пояснением владельцу и сохранением личных текстов."
  - bugfix: "Личная заметка антагониста отображается в отдельном приватном блоке окна предателя, не меняя его нанимателя и задания."