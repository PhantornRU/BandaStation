author: "mo0niverse"
delete-after: True
changes:
  - rscadd: "В Stealthy Weapons добавлена волоконная удавка за 3 ТК."
  - rscadd: "В Implants добавлены Binyat за 5 ТК, катушка моноструны за 8 ТК, глаза Kaleido за 2 ТК и набор клинков Богомола «Нагината» за 10 ТК."
  - rscadd: "Binyat позволяет дистанционно взламывать устройства и двери, а также временно отключать камеры. Моноструна выбивает предметы из рук; клинки Богомола позволяют наносить двойные удары, вскрывать двери и блокировать атаки."
  - rscadd: "Новые предметы и установленные импланты обнаруживаются сканером контрабанды."
  - bugfix: "Камеры восстанавливают исходные сети после одиночного и повторного отключения ЭМИ."