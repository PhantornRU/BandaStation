author: "mo0niverse"
delete-after: True
changes:
  - qol: "Предыстория получила зависимые списки, вложенные фракции и устойчивую кнопку раскрытия."
  - rscadd: "Подтверждённые кланы и дома добавлены в предысторию; каста скрелла перенесена туда с сохранением прежнего значения."
  - rscadd: "Добавлена необязательная приватная биография антагониста без влияния на выдачу ролей, цели и оснащение."
  - bugfix: "Исключены неподходящие места жительства; старые анкеты сохраняют данные и предлагают исправление."
  - bugfix: "Приватная биография использует фактический слот созданного персонажа и не перечитывает другой профиль посреди раунда."