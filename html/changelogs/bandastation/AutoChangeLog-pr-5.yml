  - rscadd: "В инженерный отдел добавлена профессия «Челнок-инженер»."
  - rscadd: "Добавлены бортовой монитор, замена воздушного баллона и очистка атмосферы челнока от CO₂."
  - map: "В инженерных отделах восьми станций установлен отдельный фабрикатор подов."
  - bugfix: "Исправлены столкновения и перемещение транспорта размером несколько клеток."
  - sound: "Двигатель челнока звучит во время полёта и замолкает при остановке."